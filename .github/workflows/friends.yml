name: Friends Network Update

on:
  schedule:
    - cron: "30 0 */3 * *"  # 每3天运行一次，错开30分钟
  workflow_dispatch:        # 允许手动触发
  push:
    branches: ["workflows"] # workflows分支推送时触发
    paths:
      - "assets/friends/friends.json"
      - "src/friends/**"
      - ".github/workflows/friends.yml"

jobs:
  update-friends:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
          
      # 创建必要的目录
      - name: Create required directories
        run: |
          mkdir -p assets/friends/avatars
          mkdir -p assets/friends/generated
          
      # 安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          
      # 设置Node环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
          
      # 安装依赖
      - name: Install dependencies
        run: |
          pnpm config set auto-install-peers true
          pnpm install --no-frozen-lockfile
          
      # 生成朋友网络
      - name: Generate friends network
        run: node src/friends/generate-friends.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update README
        run: node src/scripts/update-readme.js
      
      # 提交更改到main分支
      - name: Push to main branch
        run: |
          # 保存生成的文件
          mkdir -p temp_files/friends/avatars
          mkdir -p temp_files/friends/generated
          cp -r assets/friends/avatars/* temp_files/friends/avatars/ || true
          cp -r assets/friends/generated/* temp_files/friends/generated/ || true
          
          git reset --hard
          git fetch origin ${{ github.event.repository.default_branch }}:${{ github.event.repository.default_branch }}
          git checkout ${{ github.event.repository.default_branch }}
          
          mkdir -p assets/friends/avatars
          mkdir -p assets/friends/generated
          
          cp -r temp_files/friends/avatars/* assets/friends/avatars/ || true
          cp -r temp_files/friends/generated/* assets/friends/generated/ || true
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add assets/friends/avatars/ assets/friends/generated/ README.md
          git diff --staged --quiet || git commit -m "chore: update friends network"
          git push origin ${{ github.event.repository.default_branch }}
          
          git checkout workflows