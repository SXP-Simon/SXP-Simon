name: Run Friends Script

on:
  push:
    branches:
      - "workflows"
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  run-friends-js:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

      - name: Create Friend_avatar directory
        run: mkdir -p Friend_avatar

      - name: Download avatars
        run: node download_avatars.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Run friends.js with no sandbox
        run: node friends.js --no-sandbox
        env:
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Push to main branch
        run: |
          # 保存生成的文件
          mkdir -p temp_assets
          cp -r Friend_avatar/*.png temp_assets/
          cp friends_layout.svg temp_assets/

          # 切换到main分支
          git fetch origin main:main
          git checkout main
          
          # 复制生成的文件到main分支
          cp -r temp_assets/* Friend_avatar/
          cp temp_assets/friends_layout.svg ./
          
          # 配置Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 提交更改
          git add -f Friend_avatar/*.png friends_layout.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(generated): Update friends layout and avatars"
            git push origin main
          fi
          
          # 切回workflows分支
          git checkout workflows