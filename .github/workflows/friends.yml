name: Friends Network Update

on:
  schedule:
    - cron: "30 0 */3 * *"  # 每3天运行一次，错开30分钟
  workflow_dispatch:        # 允许手动触发
  push:
    branches: ["workflows"] # workflows分支推送时触发
    paths:
      - "assets/friends/friends.json"
      - "src/friends/**"
      - ".github/workflows/friends.yml"

jobs:
  update-friends:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
          
      # 设置Node环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      # 安装依赖
      - name: Install dependencies
        run: pnpm install
          
      # 生成朋友网络
      - name: Generate friends network
        run: node src/friends/generate-friends.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # 提交更改到main分支
      - name: Push to main branch
        run: |
          # 保存生成的文件
          mkdir -p temp_files/friends
          cp -r assets/friends/avatars temp_files/friends/
          cp -r assets/friends/generated temp_files/friends/
          
          # 切换到main分支
          git fetch origin main:main
          git checkout main
          
          # 确保目标目录存在
          mkdir -p assets/friends/avatars
          mkdir -p assets/friends/generated
          
          # 复制文件
          cp -r temp_files/friends/avatars/* assets/friends/avatars/
          cp -r temp_files/friends/generated/* assets/friends/generated/
          
          # 配置Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 提交更改
          git add assets/friends/avatars/ assets/friends/generated/
          git diff --staged --quiet || git commit -m "chore: update friends network"
          git push origin main
          
          # 切回workflows分支
          git checkout workflows