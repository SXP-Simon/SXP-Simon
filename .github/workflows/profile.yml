name: Profile Update

on:
  schedule:
    - cron: "0 0 */3 * *"  # 每3天运行一次
  workflow_dispatch:        # 允许手动触发
  push:
    branches: ["workflows"] # workflows分支推送时触发
    paths:
      - "README.md"
      - "src/scripts/**"
      - ".github/workflows/profile.yml"

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: workflows
          
      # 创建必要的目录
      - name: Create required directories
        run: |
          mkdir -p assets/metrics
          mkdir -p assets/profile-3d
          
      # 生成GitHub统计信息
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_introduction: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_lines: yes
          output_action: commit
          committer_branch: workflows
          committer_message: "chore: update metrics"
          filename: assets/metrics/github-metrics.svg
          
      # 生成3D贡献图
      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 300

      # 安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          
      # 设置Node环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      # 更新README
      - name: Update README
        run: node src/scripts/update-readme.js
        
      # 配置Git并提交更改
      - name: Configure Git and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 保存当前更改
          git stash -u
          
          # 更新远程代码
          git pull origin workflows --rebase
          
          # 恢复更改
          git stash pop || true
          
          # 添加并提交更改
          git add assets/metrics/ assets/profile-3d/ README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile statistics"
          git push origin workflows 