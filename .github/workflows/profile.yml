name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 */3 * *"  # 每3天运行一次
  workflow_dispatch:        # 允许手动触发
  push:
    branches: ["workflows"] # workflows分支推送时触发

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: workflows
          
      # 生成3D贡献图
      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 300

      # 配置Git并提交更改到 workflows 分支
      - name: Configure Git and Push Changes to workflows
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加并提交更改
          git add profile-3d-contrib/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update 3d profile"
          git push origin workflows

      # 同步更改到 main 分支
      - name: Sync changes to main branch
        run: |
          # 切换到 main 分支并更新
          git fetch origin main
          git checkout main

          # 复制文件
          mkdir -p profile-3d-contrib
          git checkout workflows -- profile-3d-contrib/

          # 移动到 assets 目录
          mkdir -p assets/profile-3d
          rm -rf assets/profile-3d/*
          mv profile-3d-contrib/* assets/profile-3d/
          rm -rf profile-3d-contrib

          # 提交更改
          git add assets/profile-3d/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync 3d profile from workflows branch"
          git push origin main 