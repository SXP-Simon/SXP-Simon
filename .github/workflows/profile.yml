name: Profile Update

on:
  schedule:
    - cron: "0 0 */3 * *"  # 每3天运行一次
  workflow_dispatch:        # 允许手动触发
  push:
    branches: ["workflows"] # workflows分支推送时触发
    paths:
      - "README.md"
      - "src/scripts/**"
      - ".github/workflows/profile.yml"

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
          
      # 创建必要的目录
      - name: Create required directories
        run: |
          mkdir -p assets/metrics
          mkdir -p assets/profile-3d
          
      # 生成GitHub统计信息
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_introduction: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_lines: yes
          output_action: commit
          committer_branch: ${{ github.event.repository.default_branch }}
          committer_message: "chore: update metrics"
          filename: assets/metrics/github-metrics.svg
          
      # 生成3D贡献图
      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 300

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push 3D profile
        run: |
          git add profile-3d-contrib/ -f
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): update 3d contrib graph"
            git fetch origin ${{ github.event.repository.default_branch }}
            if ! git rebase origin/${{ github.event.repository.default_branch }}; then
              echo "Rebase conflict detected, resolving using ours strategy..."
              git rebase --abort
              git pull origin ${{ github.event.repository.default_branch }} --rebase --strategy-option=ours
            fi
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      # 安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          
      # 设置Node环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
          
      - name: Install dependencies
        run: |
          pnpm config set auto-install-peers true
          pnpm install --no-frozen-lockfile
        
      # 更新README
      - name: Update README
        run: node src/scripts/update-readme.js
        
      # 提交更改到main分支
      - name: Push to main branch
        run: |
          mkdir -p temp_files/metrics
          mkdir -p temp_files/profile-3d
          cp -r assets/metrics/* temp_files/metrics/ || true
          cp -r assets/profile-3d/* temp_files/profile-3d/ || true
          cp README.md temp_files/ || true

          git fetch origin ${{ github.event.repository.default_branch }}:${{ github.event.repository.default_branch }}
          git checkout ${{ github.event.repository.default_branch }}

          mkdir -p assets/metrics
          mkdir -p assets/profile-3d

          cp -r temp_files/metrics/* assets/metrics/ || true
          cp -r temp_files/profile-3d/* assets/profile-3d/ || true
          cp temp_files/README.md ./ || true

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add assets/metrics/ assets/profile-3d/ README.md
          git diff --staged --quiet || git commit -m "chore: update profile statistics"
          git fetch origin ${{ github.event.repository.default_branch }}
          if ! git rebase origin/${{ github.event.repository.default_branch }}; then
            echo "Rebase conflict detected, resolving using ours strategy..."
            git rebase --abort
            git pull origin ${{ github.event.repository.default_branch }} --rebase --strategy-option=ours
          fi
          git push origin HEAD:${{ github.event.repository.default_branch }}

          git checkout workflows 