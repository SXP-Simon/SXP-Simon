name: GitHub-Profile-3D-Contrib

on:
  # 运行在 push 到 workflows 分支时
  push:
    branches: [ "workflows" ]
  # 每3天运行一次
  schedule:
    - cron: "0 0 */3 * *"
  # 允许从 Actions 标签页手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 300

      - name: Push to main branch
        run: |
          # 保存生成的文件
          mkdir -p temp_profile
          cp -r profile-3d-contrib/* temp_profile/ || true

          # 切换到main分支
          git fetch origin main:main
          git checkout main
          
          # 清理并创建目录
          rm -rf profile-3d-contrib || true
          mkdir -p profile-3d-contrib
          
          # 复制新生成的文件
          cp -r temp_profile/* profile-3d-contrib/ || true
          
          # 配置Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 提交更改
          git add profile-3d-contrib/ -f
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): update 3d contrib graph"
            git push origin main
          fi
          
          # 切回workflows分支
          git checkout workflows 