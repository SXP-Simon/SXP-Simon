name: Generate README

on:
  # run automatically every 3 days
  schedule:
    - cron: "0 0 */3 * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on push to workflows branch
  push:
    branches:
      - workflows
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true

      - uses: actions/setup-node@v4.3.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: true

      - name: Install canvas
        run: pnpm add canvas

      - name: Generate README
        run: |
          pnpm install
          node download_avatars.js
          node compress_avatars.js
          node friends.js
          node generate_friends_png.js

      - name: Verify generated files
        run: |
          if [ ! -f "README.md" ]; then
            echo "Error: README.md was not generated"
            exit 1
          fi
          if [ ! -f "friends_layout.png" ]; then
            echo "Error: friends_layout.png was not generated"
            exit 1
          fi
          echo "Generated files exist and are ready for commit"

      - name: Push to main branch
        run: |
          # 保存生成的文件
          mkdir -p temp_files
          cp README.md temp_files/ || true
          cp friends_layout.svg temp_files/ || true
          cp friends_layout.png temp_files/ || true
          cp -r Friend_avatar temp_files/ || true

          # 清理工作区
          git clean -fd
          rm -f friends_layout.svg || true
          rm -f friends_layout.png || true
          
          # 切换到main分支
          git fetch origin main:main
          git checkout main
          
          # 更新文件
          cp temp_files/README.md . || true
          cp temp_files/friends_layout.svg . || true
          cp temp_files/friends_layout.png . || true
          if [ -d "temp_files/Friend_avatar" ]; then
            mkdir -p Friend_avatar
            cp -r temp_files/Friend_avatar/* Friend_avatar/ || true
          fi
          
          # 配置Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 提交更改
          git add README.md friends_layout.svg friends_layout.png Friend_avatar/ -f || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(readme): update"
            git push origin main
          fi
          
          # 清理并切回workflows分支
          git clean -fd
          git checkout workflows