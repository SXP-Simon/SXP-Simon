<?xml version="1.0" encoding="UTF-8"?>
    <svg width="720" height="360" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <!-- Tech Pattern -->
        <pattern id="techPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
          <rect width="50" height="50" fill="url(#cardGradient)"/>
          <path d="M0 0L50 50M50 0L0 50" stroke="#4a90e2" stroke-width="0.5" opacity="0.1"/>
        </pattern>

        <!-- Card Background Gradient with Tech Theme -->
        <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0a192f">
            <animate
              attributeName="stop-color"
              values="#0a192f;#112240;#0a192f"
              dur="8s"
              repeatCount="indefinite"
            />
          </stop>
          <stop offset="100%" stop-color="#112240">
            <animate
              attributeName="stop-color"
              values="#112240;#0a192f;#112240"
              dur="8s"
              repeatCount="indefinite"
            />
          </stop>
        </linearGradient>

        <!-- Border Gradient -->
        <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4a90e2"/>
          <stop offset="100%" stop-color="#63f5ac"/>
        </linearGradient>

        <!-- Text Gradient -->
        <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#63f5ac"/>
        </linearGradient>

        <!-- Tag Gradient -->
        <linearGradient id="tagGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4a90e2"/>
          <stop offset="100%" stop-color="#63f5ac"/>
        </linearGradient>

        <!-- Glow Effect -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      
      <!-- Background -->
      <rect width="100%" height="100%" fill="#0a192f"/>
      
      <!-- Friend Cards -->
      
    <g transform="translate(0, 0)">
      <!-- Tech Background Pattern -->
      <rect
        x="0" y="0" width="340" height="160"
        rx="24" ry="24"
        fill="url(#techPattern)"
        filter="url(#glow)"
      >
        <animate
          attributeName="fill-opacity"
          values="0.95;1;0.95"
          dur="4s"
          repeatCount="indefinite"
        />
      </rect>
      
      <!-- Decorative Tech Lines -->
      <path
        d="M24,0 L316,0 M0,24 L0,136 M340,24 L340,136 M24,160 L316,160"
        stroke="#4a90e2"
        stroke-width="0.5"
        stroke-dasharray="4 4"
        opacity="0.2"
      >
        <animate
          attributeName="stroke-dashoffset"
          values="0;8"
          dur="1s"
          repeatCount="indefinite"
        />
      </path>
      
      <!-- Avatar Border Animation -->
      <circle
        cx="60" cy="80" r="42"
        fill="none"
        stroke="url(#borderGradient)"
        stroke-width="4"
        filter="url(#glow)"
      >
        <animate
          attributeName="stroke-dasharray"
          values="0 264;264 0;0 264"
          dur="8s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="stroke-width"
          values="4;5;4"
          dur="4s"
          repeatCount="indefinite"
        />
      </circle>
      
      <!-- Avatar -->
      <clipPath id="avatarClip0">
        <circle cx="60" cy="80" r="40"/>
      </clipPath>
      <image
        href="https://raw.githubusercontent.com/SXP-Simon/SXP-Simon/main/Friend_avatar/SXP-Simon.png"
        x="20" y="40"
        width="80" height="80"
        clip-path="url(#avatarClip0)"
      />
      
      <!-- Name with Gradient Animation -->
      <text
        x="120" y="70"
        font-family="'Noto Sans SC', sans-serif"
        font-size="24"
        font-weight="700"
        fill="url(#textGradient)"
        filter="url(#glow)"
      >
        Simon
        <animate
          attributeName="fill-opacity"
          values="0.8;1;0.8"
          dur="3s"
          repeatCount="indefinite"
        />
      </text>
      
      <!-- Bio -->
      <text
        x="120" y="100"
        font-family="'Noto Sans SC', sans-serif"
        font-size="14"
        fill="#ffffff"
      >Tech enthusiast and developer</text>
      
      <!-- Tag with Gradient Animation -->
      <rect
        x="240" y="20"
        width="80" height="28"
        rx="14" ry="14"
        fill="url(#tagGradient)"
        filter="url(#glow)"
      >
        <animate
          attributeName="fill-opacity"
          values="0.9;1;0.9"
          dur="3s"
          repeatCount="indefinite"
        />
      </rect>
      <text
        x="280" y="38"
        font-family="'Noto Sans SC', sans-serif"
        font-size="13"
        fill="white"
        text-anchor="middle"
      >Owner</text>
    </g>
  

